rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not provide any service actions.
  appropriate-polling: done
  brands:
    status: todo
    comment: >-
      Needs a pull request adding the waterscope domain to the
      custom_integrations directory of home-assistant/brands.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: >-
      The integration has no external requirements; the API client is part of
      the integration itself, because the endpoints are undocumented and no
      published library exists.
  docs-actions:
    status: exempt
    comment: The integration does not provide any service actions.
  docs-conditions:
    status: exempt
    comment: The integration does not provide any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration does not provide any triggers.
  entity-event-setup:
    status: exempt
    comment: The integration polls a cloud API and subscribes to no events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration does not provide any service actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration does not have an options flow.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: >-
      The service is cloud-only; meters have no local network presence to
      discover or update connection details from.
  discovery:
    status: exempt
    comment: >-
      The service is cloud-only; meters have no local network presence to
      discover.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: >-
      The only actionable failure state is rejected credentials, which is
      surfaced through the reauthentication flow.
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
