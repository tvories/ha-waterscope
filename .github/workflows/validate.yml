name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Check the test harness is current
        # pip quietly falls back to an old harness, and with it an old Home
        # Assistant, when the newest one needs a newer Python than this job
        # runs. Fail loudly instead, so the tests never silently stop covering
        # current Home Assistant.
        run: |
          installed=$(python -c "import importlib.metadata as m; print(m.version('pytest-homeassistant-custom-component'))")
          latest=$(curl -fsS https://pypi.org/pypi/pytest-homeassistant-custom-component/json | python -c "import json, sys; print(json.load(sys.stdin)['info']['version'])")
          ha=$(python -c "import homeassistant.const as c; print(c.__version__)")
          echo "Testing against Home Assistant $ha (harness $installed, latest $latest)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$installed" != "$latest" ]; then
            echo "::error::Test harness $installed is not the latest ($latest). Raise python-version to what Home Assistant now requires."
            exit 1
          fi
      - name: Run tests
        run: pytest --cov-report=term-missing --cov-fail-under=95

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Type check
        run: mypy custom_components/waterscope tests
